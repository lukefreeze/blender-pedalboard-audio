name: Build hijacker_engine

on:
  push:
    branches: [ feature/hijacker-engine ]
  workflow_dispatch:

jobs:

  # ===========================================================================
  # WINDOWS
  # ===========================================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11
        run: pip install pybind11

      - name: Create audaspace stubs
        shell: bash
        run: |
          cat > include/ISound.h << 'STUB'
          #pragma once
          namespace aud { typedef float sample_t; class ISound {}; class IReader {}; }
          STUB
          cp include/ISound.h include/IReader.h

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build hijacker_engine.pyd
        shell: bash
        run: |
          PYBIND11_INC=$(python -c "import pybind11; print(pybind11.get_include())")
          PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
          PY_LIBS=$(python -c "import sysconfig; print(sysconfig.get_config_var('installed_base') + '/libs')")

          # Install PortAudio via vcpkg
          vcpkg install portaudio:x64-windows-static
          PA_INC="C:/vcpkg/installed/x64-windows-static/include"
          PA_LIB="C:/vcpkg/installed/x64-windows-static/lib/portaudio_static.lib"

          cl.exe /O2 /LD /EHsc /std:c++17 \
            /I "include" \
            /I "src" \
            /I "src/imgui" \
            /I "$PY_INC" \
            /I "$PYBIND11_INC" \
            /I "$PA_INC" \
            src/wrapper.cpp \
            src/hijacker_processor.cpp \
            src/hijacker_audio_engine.cpp \
            src/mixer_ui.cpp \
            src/imgui/imgui.cpp \
            src/imgui/imgui_draw.cpp \
            src/imgui/imgui_widgets.cpp \
            src/imgui/imgui_tables.cpp \
            /link \
            /OUT:blender_sync/hijacker_engine.pyd \
            /LIBPATH:"$PY_LIBS" \
            "$PA_LIB" \
            winmm.lib ole32.lib uuid.lib advapi32.lib

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hijacker_engine-windows
          path: blender_sync/hijacker_engine.pyd


  # ===========================================================================
  # LINUX
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
          pip install pybind11

      - name: Create audaspace stubs
        run: |
          cat > include/ISound.h << 'STUB'
          #pragma once
          namespace aud { typedef float sample_t; class ISound {}; class IReader {}; }
          STUB
          cp include/ISound.h include/IReader.h

      - name: Build hijacker_engine.so
        run: |
          PYBIND11_INC=$(python -c "import pybind11; print(pybind11.get_include())")
          PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
          PY_LIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LDLIBRARY'))")
          PY_LIBDIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")

          g++ -O2 -shared -fPIC -std=c++17 \
            -I include \
            -I src \
            -I src/imgui \
            -I "$PY_INC" \
            -I "$PYBIND11_INC" \
            -I /usr/include \
            src/wrapper.cpp \
            src/hijacker_processor.cpp \
            src/hijacker_audio_engine.cpp \
            src/mixer_ui.cpp \
            src/imgui/imgui.cpp \
            src/imgui/imgui_draw.cpp \
            src/imgui/imgui_widgets.cpp \
            src/imgui/imgui_tables.cpp \
            -o blender_sync/hijacker_engine.so \
            -L"$PY_LIBDIR" -l:"$PY_LIB" \
            -lportaudio \
            -lpthread -ldl -lm

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hijacker_engine-linux
          path: blender_sync/hijacker_engine.so


  # ===========================================================================
  # MACOS
  # ===========================================================================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          brew install portaudio
          pip install pybind11

      - name: Create audaspace stubs
        run: |
          cat > include/ISound.h << 'STUB'
          #pragma once
          namespace aud { typedef float sample_t; class ISound {}; class IReader {}; }
          STUB
          cp include/ISound.h include/IReader.h

      - name: Build hijacker_engine.so
        run: |
          PYBIND11_INC=$(python -c "import pybind11; print(pybind11.get_include())")
          PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
          PY_LIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LDLIBRARY'))")
          PY_LIBDIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          PA_INC=$(brew --prefix portaudio)/include
          PA_LIB=$(brew --prefix portaudio)/lib

          g++ -O2 -shared -fPIC -std=c++17 \
            -I include \
            -I src \
            -I src/imgui \
            -I "$PY_INC" \
            -I "$PYBIND11_INC" \
            -I "$PA_INC" \
            src/wrapper.cpp \
            src/hijacker_processor.cpp \
            src/hijacker_audio_engine.cpp \
            src/mixer_ui.cpp \
            src/imgui/imgui.cpp \
            src/imgui/imgui_draw.cpp \
            src/imgui/imgui_widgets.cpp \
            src/imgui/imgui_tables.cpp \
            -o blender_sync/hijacker_engine.so \
            -L"$PY_LIBDIR" -l:"$PY_LIB" \
            -L"$PA_LIB" -lportaudio \
            -framework CoreAudio \
            -framework AudioToolbox \
            -framework AudioUnit \
            -framework CoreServices \
            -lpthread -ldl -lm

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hijacker_engine-macos
          path: blender_sync/hijacker_engine.so
